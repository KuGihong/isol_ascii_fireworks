<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050e"><title>이솔 · 유랑성 · 11/11 불꽃놀이</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050e}body{display:grid;place-items:center}canvas{display:block;width:100vw;height:100vh;object-fit:contain}#hint{position:fixed;bottom:12px;right:16px;color:#8a91a9;font:12px system-ui;opacity:.65;user-select:none}#hint:hover{opacity:1}button{color:inherit;background:transparent;border:0;cursor:pointer;font:inherit} @media(max-width:600px){#hint{bottom:8px;right:8px;font-size:10px}}</style></head>
<body><canvas id="scene" aria-label="한강 야경과 형형색색의 불꽃이 ASCII 문자로 나타나는 애니메이션"></canvas><div id="hint"><button id="pause" title="재생/일시정지">Ⅱ 일시정지</button> · <button id="restart">처음부터</button></div>
<script>
'use strict';
// Original Python artwork reimplemented in browser-native JavaScript.
// No libraries, server, external assets, or network requests are needed.
const COLS=116,ROWS=60,LOOP=20,SHORE=-.62,RISE=.55,SHADE=' .,:;-=+*#%@';
const WHITE=[255,255,255],GOLD=[255,200,70],RED=[255,60,80],PINK=[255,110,200],VIOLET=[170,110,255],CYAN=[80,220,255],GREEN=[90,255,140],ORANGE=[255,140,40],NAVY=[60,90,170];
const WINDOW=[GOLD,WHITE,CYAN,ORANGE];
let seed=1231;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function range(a,b){return a+(b-a)*rand()}function ease(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function gaussian(){return Math.sqrt(-2*Math.log(Math.max(rand(),1e-10)))*Math.cos(2*Math.PI*rand())}
const city=[],arch=[],deck=[],lamps=[],stars=[],dirs=[],ring=[];
for(let i=0;i<26000;i++){let x=range(-2.05,2.05),slot=Math.floor(x*5.5),h=.22+.75*Math.pow(Math.abs(Math.sin(slot*12.9898)),1.6);let tower=Math.abs(x-1.1)<.035;if(tower)h=1.25;let y=SHORE+rand()*h;let lit=Math.sin(x*120)>.1&&Math.sin(y*130)>.2&&Math.sin(slot*7.7+Math.floor(y*16)*3.1)>-.1&&!tower;let roof=Math.abs(y-SHORE-h)<.012;city.push({x,y,lit,roof,col:WINDOW[((slot+Math.floor(y*16))%4+4)%4]});}
for(let cx of [-1,.95])for(let i=0;i<1400;i++){let s=-1+2*i/1399;arch.push([cx+s*.95,SHORE+.04+.32*(1-s*s),.4]);}
for(let i=0;i<2400;i++)deck.push([-2.05+4.1*i/2399,SHORE+.04,.4]);
for(let i=0;i<46;i++)lamps.push([-2+4*i/45,SHORE+.1,.4]);
for(let i=0;i<220;i++)stars.push([range(-2.05,2.05),range(-.2,1.6),-1,range(0,6.3)]);
for(let i=0;i<260;i++){let d=[gaussian(),gaussian(),gaussian()],norm=Math.hypot(...d)||1;dirs.push(d.map(v=>v/norm));let a=2*Math.PI*i/260;ring.push([Math.cos(a),Math.sin(a),0]);}
// Three firework glyphs, drawn as particle silhouettes.
function makeGlyph(label){
 const c=document.createElement('canvas');c.width=640;c.height=150;
 const g=c.getContext('2d',{willReadFrequently:true});
 g.fillStyle='#fff';g.font='bold 126px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif';
 g.textAlign='center';g.textBaseline='middle';g.fillText(label,320,76);
 const pixels=g.getImageData(0,0,640,150).data,points=[];
 for(let yy=8;yy<145;yy+=4)for(let xx=5;xx<635;xx+=4)
  if(pixels[(yy*640+xx)*4+3]>100)points.push([(xx-320)/320,(75-yy)/75]);
 return points.filter((_,i)=>i%2===0);
}
const glyphs=['이솔','유랑성','11/11'].map(makeGlyph);
const shots=[[-1.2,.75,.55,GOLD,'peony'],[1.15,.95,.6,PINK,'peony'],[-.1,1.15,.75,CYAN,'ring'],[-1.55,.35,.5,GREEN,'crackle'],[1.5,.4,.5,VIOLET,'peony'],[.55,.7,.7,GOLD,'willow'],[-.7,1,.65,RED,'double'],[0,.85,.95,WHITE,'big']];
const finale=[[.45,.7,1,.75,GOLD,'big'],[1.2,-1.1,.8,.6,PINK,'peony'],[1.9,1.5,.6,.5,CYAN,'crackle'],[2.6,-.2,1.2,.7,VIOLET,'ring'],[3.3,-1.6,.5,.5,GREEN,'peony'],[4,1,1.05,.7,GOLD,'willow'],[4.7,-.8,.95,.6,RED,'double'],[5.4,1.6,.9,.55,ORANGE,'peony'],[6.1,-1.4,1.1,.6,CYAN,'ring'],[6.8,.3,.6,.55,PINK,'crackle'],[10.4,-1.5,.7,.6,GREEN,'peony'],[11.1,1.2,1.15,.7,VIOLET,'double'],[11.8,-.3,.9,.65,GOLD,'willow'],[12.5,1.6,.5,.5,RED,'crackle'],[16,-1.4,.9,.6,PINK,'peony'],[16.3,1.3,1.1,.65,CYAN,'ring'],[16.6,-.4,.6,.55,GREEN,'crackle'],[16.9,.6,1.2,.8,GOLD,'willow'],[17.2,-1,1.15,.6,VIOLET,'peony'],[17.5,1.6,.7,.55,ORANGE,'crackle'],[17.8,-1.7,.45,.5,WHITE,'peony'],[18.1,.9,.5,.55,RED,'double'],[18.4,0,1,1,WHITE,'big']];
// The original code reveals the city, stars and bridge while its source is typed.
const shells=[...shots.map((s,i)=>[1.7+RISE+i*.62,...s]),...finale];
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});let cellW=10,cellH=15,ox=0,oy=0;
function resize(){let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);let unit=Math.min(w/(COLS*.63),h/(ROWS*1.12));cellW=unit*.63;cellH=unit*1.12;ox=(w-cellW*COLS)/2;oy=(h-cellH*ROWS)/2;ctx.font=`${unit}px ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace`;ctx.textBaseline='top';ctx.textAlign='center';}addEventListener('resize',resize);resize();
const N=COLS*ROWS;let img=new Float32Array(N*3),depth=new Float32Array(N),chars=new Array(N);
function project(x,y,z,yaw){x+=yaw*z;let zz=Math.max(3.6-z,1.4),gx=Math.floor(COLS/2+x*102/zz),gy=Math.floor(ROWS/2-(y+.12)*61/zz);return gx>=0&&gx<COLS&&gy>=0&&gy<ROWS?gy*COLS+gx:-1;}
function draw(t){t%=LOOP;img.fill(0);depth.fill(99);let yaw=.06*Math.sin(2*Math.PI*t/LOOP),solid=[],glow=[];let flash=0,tint=[0,0,0];for(let [t0,x,y,r,col] of shells)if(t>=t0){let f=Math.exp(-(t-t0)*5)*r;flash+=f;for(let j=0;j<3;j++)tint[j]+=f*col[j];}for(let j=0;j<3;j++)tint[j]/=flash+1e-6;
function add(x,y,z,v,col,mode='glow'){if(v<=.005)return;(mode==='solid'?solid:glow).push([x,y,z,v,col]);}
let g=ease(t/2.5);for(let i=0;i<Math.floor(g*stars.length);i++){let [x,y,z,p]=stars[i];add(x,y,z,(.25+.5*(.5+.5*Math.sin(t*2.5+p)))*(1-.6*Math.min(1,flash)),WHITE);}
g=ease(t/5.7);for(let p of city){let up=clamp((g*4.6-(p.x+2.05))/.5,0,1);if(up<=0)continue;let y=SHORE+(p.y-SHORE)*ease(up),win=p.lit&&up>.95;let wall=p.roof?.4:.13;wall+=.5*Math.min(1,flash);let col=win?p.col:NAVY.map((v,j)=>v*(1-Math.min(1,flash)*.6)+tint[j]*Math.min(1,flash)*.6);add(p.x,y,0,win?.95+.3*Math.sin(t*3+p.x*40):wall,col,'solid');}
if(g>.8&&Math.sin(t*6)>0)for(let i=0;i<30;i++){let d=dirs[i];add(1.1+d[0]*.03,SHORE+1.27+d[1]*.03,d[2]*.03,.5,RED);}
g=ease(t/7.3);for(let i=0;i<Math.floor(g*arch.length);i++){let p=arch[i];add(...p,.55,[115,90,213],'solid');}for(let i=0;i<Math.floor(g*deck.length);i++){let p=deck[i];add(...p,.55,[115,90,213],'solid');}for(let i=0;i<Math.floor(g*lamps.length);i++){let p=lamps[i];add(...p,.7+.25*Math.sin(t*4+i),GOLD);}
function burst(t0,x,y,r,col,kind,glyph){
 let u=t-t0;
 // Keep the original ascending shell and its golden tail.
 if(u>-RISE&&u<0){let f=1+u/RISE;for(let i=0;i<26;i++){
  let k=i/25;add(x+.02*Math.sin(k*20+t*30),SHORE+(y-SHORE)*ease(f)-k*.25*f,.2,(1-k)*.9,GOLD);
 }}
 if(u<0||u>=2.6)return;
 // Each successive burst spells one of three messages.
 let expansion=1-Math.exp(-u*5.5),fade=Math.exp(-u*.95);
 let scale=r*1.65,drift=u*u*.075;
 for(let i=0;i<glyph.length;i++){
  let [px,py]=glyph[i];
  let jitter=.006*Math.sin(i*17.13+u*9);
  let xx=x+(px*scale+jitter)*expansion;
  let yy=y+(py*scale*.66+jitter)*expansion-drift;
  let shimmer=.7+.3*Math.sin(i*2.71+u*13);
  add(xx,yy,.2,fade*shimmer*1.6,col);
  if(u<.7)add(xx-px*.012,yy-py*.012,.2,fade*.4,WHITE);
 }
 if(u<.14)for(let i=0;i<40;i++){
  let a=i*Math.PI*2/40;add(x+Math.cos(a)*u*.4,y+Math.sin(a)*u*.4,.2,.5*(1-u/.14),WHITE);
 }
}
for(let j=0;j<shells.length;j++){let sh=shells[j];let group=sh[0]<7.7?0:sh[0]<13.5?1:2;burst(...sh,glyphs[group]);}
// Reflections in the Han River, rippling and intermittently broken.
let baseSolid=solid.length,baseGlow=glow.length;for(let bag of [[solid,baseSolid,.06],[glow,baseGlow,.3]]){let [arr,len,dim]=bag;for(let i=0;i<len;i++){let [x,y,z,v,col]=arr[i];if(y<=SHORE)continue;let yy=2*SHORE-y-.02;if(Math.sin(yy*95)<=-.25)continue;let ripple=.035*Math.sin((2*SHORE-y)*42+t*3);glow.push([x+ripple,yy,z,v*dim,col]);}}
for(let [x,y,z,v,col] of solid){let idx=project(x,y,z,yaw);if(idx<0)continue;let zz=Math.max(3.6-z,1.4);if(zz<depth[idx]){depth[idx]=zz;for(let j=0;j<3;j++)img[idx*3+j]=col[j]/255*v;}}
for(let [x,y,z,v,col] of glow){let idx=project(x,y,z,yaw);if(idx<0||Math.max(3.6-z,1.4)>=depth[idx]+.05)continue;for(let j=0;j<3;j++)img[idx*3+j]+=col[j]/255*v;}
// Character brightness ramp and terminal-style truecolor.
ctx.fillStyle='#03050e';ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<N;i++){let k=i*3,r=img[k],gg=img[k+1],b=img[k+2],bright=Math.max(r,gg,b);let ch=SHADE[clamp(Math.floor(bright*(SHADE.length-1)),0,SHADE.length-1)];if(ch===' ')continue;let hot=clamp(bright-1,0,1);let rr=Math.floor(Math.pow(clamp(r*(1-hot)+hot,0,1),.8)*255),gr=Math.floor(Math.pow(clamp(gg*(1-hot)+hot,0,1),.8)*255),bb=Math.floor(Math.pow(clamp(b*(1-hot)+hot,0,1),.8)*255);ctx.fillStyle=`rgb(${rr},${gr},${bb})`;ctx.fillText(ch,ox+(i%COLS+.5)*cellW,oy+Math.floor(i/COLS)*cellH);}
}
let start=performance.now(),elapsed=0,paused=false,last=0;function animate(now){if(!paused){elapsed=(now-start)/1000;if(now-last>33){draw(elapsed);last=now;}}requestAnimationFrame(animate);}requestAnimationFrame(animate);
document.getElementById('pause').onclick=()=>{paused=!paused;if(!paused)start=performance.now()-elapsed*1000;document.getElementById('pause').textContent=paused?'▶ 재생':'Ⅱ 일시정지';};document.getElementById('restart').onclick=()=>{start=performance.now();elapsed=0;draw(0);};
</script></body></html>
